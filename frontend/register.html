<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora - Registrarse</title>
    <link rel="icon" href="resource/bitacora-brand/favicons/favicon.ico" sizes="48x48">
    <link rel="icon" href="resource/bitacora-brand/favicons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="resource/bitacora-brand/favicons/apple-touch-icon.png">
    <meta name="theme-color" content="#0f1b2d">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/theme.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="container-fluid p-0">
        <div class="row g-0 auth-layout">
            <section class="col-md-7 d-none d-md-flex align-items-center justify-content-center auth-hero" aria-label="Panel de Bitácora">
                <div class="text-center">
                    <img src="images/bitacora-logo-stacked-dark.svg" alt="Bitácora" class="auth-hero-logo">
                    <p class="auth-hero-lema mb-0">Un espacio para mantener cada actualización en curso y cada decisión en perspectiva.</p>
                </div>
            </section>

            <div class="col-12 d-md-none auth-mobile-hero d-flex align-items-center justify-content-center">
                <img src="images/bitacora-logo-dark.svg" alt="Bitácora" class="auth-mobile-logo">
            </div>

            <section class="col-12 col-md-5 d-flex align-items-center justify-content-center auth-panel" aria-labelledby="register-title">
                <div class="w-100">
                    <div class="row justify-content-center">
                        <div class="col-12 col-xl-9 auth-content">
                            <a class="d-none auth-brand" href="/" aria-label="Bitácora, inicio">Bitácora</a>

                            <div class="mb-4 auth-intro">
                                <p class="text-primary fw-bold text-uppercase small mb-2 auth-kicker">Crea tu cuenta</p>
                                <h1 id="register-title" class="display-6 mb-2">Registrarse</h1>
                                <p class="text-body-secondary mb-0">Completa tus datos para comenzar.</p>
                            </div>

                            <form id="form-register" class="auth-form">
                                <div class="mb-3">
                                    <label for="register-usuario" class="form-label">Usuario</label>
                                    <input type="text" class="form-control form-control-lg" id="register-usuario" placeholder="Ingrese un usuario" autocomplete="username" required>
                                </div>

                                <div class="mb-3">
                                    <label for="register-email" class="form-label">Correo electrónico</label>
                                    <input type="email" class="form-control form-control-lg" id="register-email" placeholder="Ingrese su correo" autocomplete="email" required>
                                </div>

                                <div class="mb-3">
                                    <label for="register-contrasena" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control form-control-lg" id="register-contrasena" placeholder="Ingrese una contraseña" autocomplete="new-password" required>
                                </div>

                                <div class="mb-3">
                                    <label for="register-confirmar" class="form-label">Confirmar contraseña</label>
                                    <input type="password" class="form-control form-control-lg" id="register-confirmar" placeholder="Repita la contraseña" autocomplete="new-password" required>
                                </div>

                                <div class="d-grid gap-2 mt-4">
                                    <button type="submit" class="btn btn-primary btn-lg">Crear cuenta</button>
                                    <a href="/login" id="volver-login" class="btn btn-outline-secondary">Volver a iniciar sesión</a>
                                </div>

                                <div id="mensaje-register" class="alert alert-success mt-3 d-none" role="alert"></div>
                                <div id="mensaje-register-error" class="alert alert-danger mt-3 d-none" role="alert"></div>
                            </form>

                            <p class="text-body-secondary small mt-5 mb-0 auth-footer">© 2026 Bitácora</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
